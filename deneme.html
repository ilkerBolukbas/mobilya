<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilya Atölyesi | Ürün Ekle & Galeri</title>
<style>
body { font-family: Arial; padding: 20px; background:#fafafa; }
h1 { text-align:center; margin-bottom:20px; }
form { max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); display:flex; flex-direction:column; gap:15px; }
input, textarea, select { width:100%; padding:8px; border-radius:5px; border:1px solid #ccc; }
button { padding:10px; background:#b87333; color:white; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#a15d28; }
.preview-images { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.preview-images img { width:80px; height:80px; object-fit:cover; border-radius:5px; }
.products { display:flex; flex-wrap:wrap; gap:20px; margin-top:40px; justify-content:center; }
.product { background:white; padding:10px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); width:200px; text-align:center; cursor:pointer; transition:transform 0.2s; }
.product:hover { transform:translateY(-5px); }
.product img { width:100%; height:180px; object-fit:cover; border-radius:8px; }
.product h2 { font-size:18px; margin:10px 0 0 0; color:#333; }
.filter { text-align:center; margin-top:30px; }
select.filter-select { padding:8px 12px; font-size:16px; border-radius:5px; border:1px solid #ccc; }
</style>
</head>
<body>

<h1>Ürün Ekle</h1>

<form id="addForm">
  <input type="text" id="isim" placeholder="Ürün İsmi" required>
  <textarea id="aciklama" placeholder="Ürün Açıklaması" required></textarea>
  <input type="text" id="malzeme" placeholder="Malzeme" required>
  <input type="text" id="renk" placeholder="Renk" required>
  <label>Ürün Türü:</label>
  <select id="tur" required>
    <option value="">Seçiniz</option>
    <option value="masa">Masa</option>
    <option value="sandalye">Sandalye</option>
    <option value="dolap">Dolap</option>
    <option value="diger">Diğer</option>
  </select>
  <label>Resimler (tek veya çoklu seçebilirsiniz):</label>
  <input type="file" id="resimler" multiple accept="image/*">
  <div class="preview-images" id="preview"></div>
  <button type="submit">Ekle</button>
</form>

<div class="filter">
  <label>Ürün Türü Filtrele:</label>
  <select id="turSelect" class="filter-select">
    <option value="">Tüm Ürünler</option>
    <option value="masa">Masa</option>
    <option value="sandalye">Sandalye</option>
    <option value="dolap">Dolap</option>
    <option value="diger">Diğer</option>
  </select>
</div>

<div class="products" id="products"></div>

<script>
let db;
const request = indexedDB.open('MobilyaDB', 1);

request.onerror = e => console.error('DB açılırken hata:', e);
request.onsuccess = e => {
  db = e.target.result;
  console.log('DB açıldı:', db);
  loadProducts(); // sayfa açılır açılmaz ürünleri yükle
};
request.onupgradeneeded = e => {
  db = e.target.result;
  if(!db.objectStoreNames.contains('products')){
    db.createObjectStore('products', { keyPath:'id', autoIncrement:true });
  }
};

const addForm = document.getElementById('addForm');
const resimInput = document.getElementById('resimler');
const previewDiv = document.getElementById('preview');
const turSelect = document.getElementById('turSelect');
const productsContainer = document.getElementById('products');
let selectedFiles = [];

// Resim önizleme
resimInput.addEventListener('change', e => {
  previewDiv.innerHTML = '';
  selectedFiles = e.target.files ? Array.from(e.target.files) : [];
  selectedFiles.forEach(file => {
    if(!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = event => {
      const img = document.createElement('img');
      img.src = event.target.result;
      previewDiv.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

// Form submit
addForm.addEventListener('submit', async e => {
  e.preventDefault();
  if(!db){ alert('DB henüz hazır değil. Sayfayı yenileyin.'); return; }

  const yeniUrun = {
    isim: document.getElementById('isim').value,
    aciklama: document.getElementById('aciklama').value,
    malzeme: document.getElementById('malzeme').value,
    renk: document.getElementById('renk').value,
    tur: document.getElementById('tur').value.toLowerCase(),
    resimler: []
  };

  try {
    for(const file of selectedFiles){
      if(!file.type.startsWith('image/')) continue;
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = ()=>reject('Dosya okunamadı: '+file.name);
        reader.readAsDataURL(file);
      });
      yeniUrun.resimler.push(dataUrl);
    }

    const tx = db.transaction(['products'], 'readwrite');
    const store = tx.objectStore('products');
    store.add(yeniUrun);

    tx.oncomplete = () => {
      alert('Ürün eklendi!');
      addForm.reset();
      previewDiv.innerHTML='';
      selectedFiles=[];
      loadProducts(turSelect.value); // ekleme sonrası galeriyi yenile
    };

    tx.onerror = e => { console.error('Ürün ekleme hatası:', e); alert('Ürün eklenirken hata oluştu'); };

  } catch(err) { console.error(err); alert('Resimler yüklenirken hata oluştu: '+err); }
});

// Filtre değiştiğinde ürünleri yükle
turSelect.addEventListener('change', () => loadProducts(turSelect.value));

// Ürünleri yükleme
function loadProducts(filtreTur = ''){
  if(!db) return;
  const transaction = db.transaction(['products'], 'readonly');
  const store = transaction.objectStore('products');
  const getAllRequest = store.getAll();

  getAllRequest.onsuccess = e => {
    let products = e.target.result;
    if(filtreTur) products = products.filter(p => p.tur === filtreTur);

    productsContainer.innerHTML = '';
    products.forEach(p => {
      const div = document.createElement('div');
      div.className = 'product';
      div.onclick = () => alert(`Ürün detay sayfasına yönlendirme: ${p.isim}`);
      const imgSrc = p.resimler && p.resimler.length>0 ? p.resimler[0] : '';
      div.innerHTML = `<img src="${imgSrc}" alt="${p.isim}"><h2>${p.isim}</h2>`;
      productsContainer.appendChild(div);
    });
  };
  getAllRequest.onerror = e => console.error('Ürünler yüklenirken hata:', e);
}
</script>

</body>
</html>
