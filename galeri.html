<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ürün Galerisi</title>
  <link rel="stylesheet" href="css/galeri.css">
  <style>
    body{font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#fafafa; margin:0; padding:0}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:10px 16px;z-index:10}
    .container{max-width:1200px;margin:0 auto;padding:16px;}
    select{padding:8px 12px;border-radius:8px;border:1px solid #ddd;font-weight:600;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px;}
    .card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06);overflow:hidden;border:1px solid #eee;cursor:pointer;transition:transform .15s;}
    .card:hover{transform:translateY(-3px);}
    .card img{width:100%;height:180px;object-fit:cover;display:block}
    .card .p{padding:12px}
    .name{font-weight:700}
    .muted{color:#666;font-size:14px}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <label for="filterSelect"><strong>Kategori:</strong></label>
      <select id="filterSelect"></select>
    </div>
  </header>

  <main class="container">
    <div class="grid" id="grid"></div>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
